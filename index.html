<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Boule et ligne</title>
    <style>
        :root { --s: 1; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; margin: 0; background-color: #2F2F2F; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font-family: Arial, sans-serif; }
        .camera { position: absolute; width: 100%; height: 100%; left: 0; top: 0; transform-origin: 0 100%; }
        .line { position: absolute; left: 0; width: 100%; height: calc(10px * var(--s)); background-color: #00007f; bottom: 0; z-index: 1; }
        .ball { position: absolute; left: 0; bottom: 0; width: 60px; height: 60px; background-color: #00007f; border: 5px solid gold; border-radius: 50%; z-index: 10; will-change: transform; }
        .cube { position: absolute; width: 60px; height: 60px; background-color: rgba(255, 0, 255, 0.5); border: 5px solid rgba(255, 215, 0, 0.5); }
        .platform { position: absolute; width: 200px; height: 10px; background-color: #00007f; z-index: 5; }

        .lives { position: absolute; top: max(10px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); color: white; font-size: 20px; z-index: 50; }
        .pause-btn { position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); padding: 12px 20px; background-color: #8f0b8f; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-family: inherit; z-index: 50; touch-action: manipulation; }

        /* Commandes tactiles */
        .pad { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); display: flex; gap: 14px; z-index: 40; }
        .jump-wrap { position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); z-index: 40; }
        .ctl { width: 84px; height: 84px; border-radius: 22px; border: 2px solid rgba(255, 215, 0, 0.6); background: rgba(255, 255, 255, 0.16); color: #fff; font-size: 30px; font-family: inherit; touch-action: none; padding: 0; }
        .ctl.jump { width: 104px; height: 104px; border-radius: 50%; font-size: 18px; font-weight: bold; }
        .ctl.active { background: rgba(255, 215, 0, 0.45); }

        .game-over { position: absolute; inset: 0; background-color: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; flex-direction: column; font-size: 44px; color: white; z-index: 100; }
        .restart-button { margin-top: 20px; font-size: 20px; padding: 14px 24px; background-color: #00007f; color: white; border: none; border-radius: 8px; touch-action: manipulation; }

        /* Demande de passer en paysage sur téléphone */
        .rotate { position: absolute; inset: 0; background: #2F2F2F; color: white; display: none; justify-content: center; align-items: center; text-align: center; padding: 24px; font-size: 22px; z-index: 200; }
        @media (orientation: portrait) and (pointer: coarse) { .rotate { display: flex; } }
    </style>
</head>
<body>
<div class="line"></div>
<div class="camera">
    <div class="ball"></div>
</div>
<div class="lives">Vies : 3</div>
<button class="pause-btn" id="pauseBtn" tabindex="-1">Pause</button>

<div class="pad">
    <button class="ctl" id="btnLeft" tabindex="-1" aria-label="Gauche">◀</button>
    <button class="ctl" id="btnRight" tabindex="-1" aria-label="Droite">▶</button>
</div>
<div class="jump-wrap">
    <button class="ctl jump" id="btnJump" tabindex="-1">SAUT</button>
</div>

<div class="game-over">
    <div>Game Over</div>
    <button class="restart-button">Recommencer La Partie</button>
</div>
<div class="rotate">Tourne ton téléphone en mode paysage pour jouer</div>

<script>
    // ---------- Constantes ----------
    const BALL = 60;
    const CUBE = 60;
    const LINE_H = 10;
    const GRAVITY = 0.5;
    const JUMP = 15;
    const SPEED = 8;
    const MAX_FALL = -35;
    const COYOTE = 6;
    const BUFFER = 6;
    const STEP = 1000 / 60;
    const VIEW_H = 480;       // hauteur de monde que l'on veut toujours voir à l'écran

    // ---------- Éléments ----------
    const root = document.documentElement;
    const camera = document.querySelector('.camera');
    const ballEl = document.querySelector('.ball');
    const livesDisplay = document.querySelector('.lives');
    const gameOverScreen = document.querySelector('.game-over');
    const restartButton = document.querySelector('.restart-button');
    const pauseBtn = document.getElementById('pauseBtn');
    const portraitMQ = window.matchMedia('(orientation: portrait) and (pointer: coarse)');

    // ---------- État ----------
    const ball = { x: 50, y: 200, vy: 0 };
    const prev = { x: 50, y: 200 };
    const solids = [];
    const keys = {};
    let lives = 3;
    let onGround = false;
    let canDouble = true;
    let coyote = 0;
    let jumpBuffer = 0;
    let ground = null;
    let lastCubeX = 320;
    let paused = false;
    let over = false;
    let scale = 1;            // échelle d'affichage (petit écran => monde réduit)

    // ---------- Échelle ----------
    function applyScale() {
        scale = Math.min(1, window.innerHeight / VIEW_H);
        root.style.setProperty('--s', scale);
    }

    // ---------- Monde ----------
    function addSolid(x, y, w, h, cls, cull) {
        const el = document.createElement('div');
        el.className = cls;
        el.style.left = x + 'px';
        el.style.bottom = y + 'px';
        camera.appendChild(el);
        const s = { x, y, w, h, el, cull };
        solids.push(s);
        return s;
    }

    function generateAhead() {
        const limit = ball.x + (window.innerWidth / scale) * 1.5;
        while (lastCubeX < limit) {
            lastCubeX += 100 + Math.random() * 200;
            addSolid(lastCubeX, 10 + Math.random() * 300, CUBE, CUBE, 'cube', true);
        }
    }

    function cullBehind() {
        const minX = ball.x - (window.innerWidth / scale) * 2;
        for (let i = solids.length - 1; i >= 0; i--) {
            const s = solids[i];
            if (s.cull && s !== ground && s.x + s.w < minX) {
                s.el.remove();
                solids.splice(i, 1);
            }
        }
    }

    function buildWorld() {
        for (const s of solids) s.el.remove();
        solids.length = 0;
        lastCubeX = 320;
        ground = addSolid(50, 150, 200, 10, 'platform', false);
        generateAhead();
    }

    // ---------- Collisions (AABB) ----------
    function overlaps(s) {
        return ball.x < s.x + s.w && ball.x + BALL > s.x &&
               ball.y < s.y + s.h && ball.y + BALL > s.y;
    }

    function respawn() {
        ball.x = ground.x + (ground.w - BALL) / 2;
        ball.y = ground.y + ground.h;
        ball.vy = 0;
        onGround = true;
        prev.x = ball.x;
        prev.y = ball.y;
    }

    function loseLife() {
        lives--;
        updateLives();
        if (lives <= 0) {
            over = true;
            gameOverScreen.style.display = 'flex';
        } else {
            respawn();
        }
    }

    // ---------- Mise à jour ----------
    function update() {
        prev.x = ball.x;
        prev.y = ball.y;

        // Saut
        if (onGround) { coyote = COYOTE; canDouble = true; }
        else if (coyote > 0) coyote--;

        if (jumpBuffer > 0) {
            if (coyote > 0) { ball.vy = JUMP; coyote = 0; jumpBuffer = 0; }
            else if (canDouble) { ball.vy = JUMP; canDouble = false; jumpBuffer = 0; }
            else jumpBuffer--;
        }

        // Axe X
        let dx = 0;
        if (keys['ArrowLeft'] || keys['KeyA']) dx -= SPEED;
        if (keys['ArrowRight'] || keys['KeyD']) dx += SPEED;
        ball.x += dx;
        if (ball.x < 0) ball.x = 0;

        for (const s of solids) {
            if (!overlaps(s)) continue;
            if (dx > 0) ball.x = s.x - BALL;
            else if (dx < 0) ball.x = s.x + s.w;
        }

        // Axe Y
        ball.vy = Math.max(ball.vy - GRAVITY, MAX_FALL);
        ball.y += ball.vy;
        onGround = false;

        for (const s of solids) {
            if (!overlaps(s)) continue;
            if (ball.vy <= 0) {
                ball.y = s.y + s.h;
                onGround = true;
                ground = s;
            } else {
                ball.y = s.y - BALL;
            }
            ball.vy = 0;
        }

        if (ball.y < LINE_H) {
            loseLife();
            if (over) return;
        }

        generateAhead();
        cullBehind();
    }

    function updateLives() {
        livesDisplay.textContent = `Vies : ${Math.max(lives, 0)}`;
    }

    function setPaused(value) {
        paused = value;
        pauseBtn.textContent = paused ? 'Reprendre' : 'Pause';
    }

    function render(alpha) {
        const x = prev.x + (ball.x - prev.x) * alpha;
        const y = prev.y + (ball.y - prev.y) * alpha;
        ballEl.style.transform = `translate(${x}px, ${-y}px)`;
        // Le monde est réduit (scale) puis décalé pour garder la boule au centre
        const tx = window.innerWidth / 2 - scale * (x + BALL / 2);
        camera.style.transform = `translateX(${tx}px) scale(${scale})`;
    }

    function restartGame() {
        lives = 3;
        over = false;
        setPaused(false);
        ball.x = 50;
        ball.y = 200;
        ball.vy = 0;
        prev.x = ball.x;
        prev.y = ball.y;
        onGround = false;
        canDouble = true;
        coyote = 0;
        jumpBuffer = 0;
        buildWorld();
        updateLives();
        gameOverScreen.style.display = 'none';
    }

    // ---------- Boucle (pas fixe + interpolation) ----------
    let last = performance.now();
    let acc = 0;
    function frame(now) {
        acc += Math.min(now - last, 100);
        last = now;
        const blocked = paused || over || portraitMQ.matches;
        while (acc >= STEP) {
            if (!blocked) update();
            acc -= STEP;
        }
        if (blocked) { prev.x = ball.x; prev.y = ball.y; }
        render(blocked ? 1 : acc / STEP);
        requestAnimationFrame(frame);
    }

    // ---------- Commandes tactiles ----------
    function bindHold(el, code) {
        const press = (e) => {
            e.preventDefault();
            keys[code] = true;
            el.classList.add('active');
            try { el.setPointerCapture(e.pointerId); } catch (_) {}
        };
        const release = () => {
            keys[code] = false;
            el.classList.remove('active');
        };
        el.addEventListener('pointerdown', press);
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
        el.addEventListener('lostpointercapture', release);
    }
    bindHold(document.getElementById('btnLeft'), 'ArrowLeft');
    bindHold(document.getElementById('btnRight'), 'ArrowRight');

    const btnJump = document.getElementById('btnJump');
    btnJump.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        jumpBuffer = BUFFER;
        btnJump.classList.add('active');
    });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t =>
        btnJump.addEventListener(t, () => btnJump.classList.remove('active')));

    pauseBtn.addEventListener('click', () => {
        if (!over) setPaused(!paused);
        pauseBtn.blur();
    });
    restartButton.addEventListener('click', restartGame);

    // Bloque le scroll, le zoom et le menu contextuel
    document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Pause automatique quand on quitte l'app
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && !over) setPaused(true);
    });

    // ---------- Clavier (tablette / test sur PC) ----------
    const GAME_KEYS = ['Space', 'ArrowUp', 'ArrowLeft', 'ArrowRight'];
    document.addEventListener('keydown', (e) => {
        if (GAME_KEYS.includes(e.code)) e.preventDefault();
        if (!e.repeat && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) jumpBuffer = BUFFER;
        if (!e.repeat && e.code === 'KeyP' && !over) setPaused(!paused);
        keys[e.code] = true;
    });
    document.addEventListener('keyup', (e) => { keys[e.code] = false; });
    window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

    window.addEventListener('resize', applyScale);
    window.addEventListener('orientationchange', applyScale);

    // ---------- Démarrage ----------
    applyScale();
    buildWorld();
    updateLives();
    requestAnimationFrame(frame);
</script>
</body>
</html>
